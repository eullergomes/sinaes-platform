name: Deploy Production - Vercel

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Branch, tag ou commit SHA que será publicado em produção"
        required: true
        default: "main"

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy-production:
    name: Deploy manual para produção
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Baixar configurações de produção da Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build de produção
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Publicar em produção
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}